<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareMate CAD</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Malgun Gothic",Arial,sans-serif;color:#173047;background:#e7ecf1;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:52px 1fr 28px}header{display:flex;align-items:center;gap:8px;padding:0 10px;background:#052445;color:#fff}
header b{font-size:16px;margin-right:auto}button,input,select{font:inherit;font-size:12px}button{padding:6px 9px;border:1px solid #b9c6d1;border-radius:5px;background:#fff;cursor:pointer}
header button{background:#123c64;color:#fff;border-color:#315d83}header span{background:#fff;color:#052445;padding:6px 9px;border-radius:4px;font-size:12px;font-weight:700}
main{min-height:0;display:grid;grid-template-columns:310px 1fr}aside{overflow:auto;background:#fff;border-right:1px solid #cbd5df;padding:8px}
.sec{border:1px solid #cbd5df;border-radius:6px;margin-bottom:8px;overflow:hidden}.sec h3{margin:0;padding:8px;background:#f4f7f9;color:#052445;font-size:13px}.pad{padding:8px}
.g2,.g3{display:grid;gap:6px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}label{display:block;font-size:11px;color:#63778a}
input,select{width:100%;height:29px;margin-top:3px;border:1px solid #b9c6d1;border-radius:4px;padding:3px 6px;background:#fff}
.row{display:flex;gap:6px;margin-top:7px}.row button{flex:1}.hint{font-size:10.5px;line-height:1.45;color:#63778a;margin-top:6px}.spec{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;font-size:11px}.spec b{color:#0b5c94}
#vp{position:relative;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%}
#info{position:absolute;left:10px;top:10px;display:none;background:#fffffff2;border:1px solid #9eafbd;border-radius:6px;padding:9px;width:245px;font-size:11px;z-index:3}
#info strong{display:block;color:#052445;border-bottom:1px solid #d5dee6;padding-bottom:5px;margin-bottom:5px}
#hint{position:absolute;right:10px;top:10px;background:#fffffff0;border:1px solid #c1ccd5;border-radius:5px;padding:7px;font-size:10.5px}
footer{background:#f8fafb;border-top:1px solid #cbd5df;padding:5px 9px;font-size:10.5px}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script></head>
<body><div id="app"><header><b>CareMate CAD</b><button data-v="iso">ISO</button><button data-v="top">TOP</button><button data-v="front">FRONT</button><button data-v="right">RIGHT</button><button id="measure">2점 측정</button><span>1 좌표 단위 = 1 mm</span></header>
<main><aside>
<div class="sec"><h3>공간</h3><div class="pad"><div class="g3"><label>X<input id="sx" type="number" value="2500"></label><label>Y<input id="sy" type="number" value="2500"></label><label>Z<input id="sz" type="number" value="2500"></label></div><div class="row"><button id="spaceBtn">적용</button></div></div></div>
<div class="sec"><h3>기본 구조</h3><div class="pad"><label>구조 이름<input id="fn" value="침대 프레임"></label><div class="g3"><label>폭 X<input id="fw" type="number" value="900"></label><label>길이 Y<input id="fl" type="number" value="2000"></label><label>높이 Z<input id="fh" type="number" value="250"></label></div><div class="g3"><label>각관 폭<input id="rw" type="number" value="20"></label><label>각관 높이<input id="rh" type="number" value="40"></label><label>가로바 수<input id="cc" type="number" value="8"></label></div><div class="row"><button id="frameBtn">구조 다시 배치</button></div><div class="hint">외부 900×2000, 내부 폭 860, 높이 250mm 기준. 가로바 간격은 임시입니다.</div></div></div>
<div class="sec"><h3>직육면체 추가</h3><div class="pad"><label>이름<input id="bn" value="부품"></label><div class="g3"><label>X 크기<input id="bw" type="number" value="500"></label><label>Y 크기<input id="bd" type="number" value="300"></label><label>Z 크기<input id="bh" type="number" value="100"></label></div><div class="g3"><label>X 위치<input id="bx" type="number" value="0"></label><label>Y 위치<input id="by" type="number" value="0"></label><label>Z 위치<input id="bz" type="number" value="0"></label></div><div class="row"><button id="boxBtn">추가</button></div></div></div>
<div class="sec"><h3>원형 허브 추가</h3><div class="pad"><label>허브 이름<input id="hn" value="BP-Hub-8"></label><div class="g3"><label>외경 Ø<input id="hod" type="number" step=".1" value="25.5"></label><label>두께 T<input id="ht" type="number" step=".1" value="10"></label><label>축홀 Ø<input id="hb" type="number" step=".1" value="8"></label></div><div class="g2"><label>PCD<input id="hpcd" type="number" step=".1" value="20"></label><label>축 방향<select id="ha"><option>X</option><option>Y</option><option>Z</option></select></label></div><div class="g3"><label>중심 X<input id="hx" type="number" value="1250"></label><label>중심 Y<input id="hy" type="number" value="1250"></label><label>중심 Z<input id="hz" type="number" value="300"></label></div><div class="row"><button id="hubBtn">허브 추가</button><button id="hubCopy" disabled>선택 허브 복제</button></div><div class="hint">기본: Ø25.5×10T / Ø8 / PCD20 / 전면 4-M3 + 4-Ø3. 전면 홀은 위치 마커이며 측면 4-M4는 사양 정보로 관리합니다.</div></div></div>
<div class="sec"><h3>STL</h3><div class="pad"><input id="stl" type="file" accept=".stl"></div></div>
<div class="sec"><h3>선택 객체</h3><div class="pad"><label>이름<input id="sn" disabled></label><div class="row"><button id="rename" disabled>이름 변경</button><button id="del" disabled>삭제</button></div><div class="spec" style="margin-top:7px"><span>종류</span><b id="sk">-</b><span>크기 X</span><b id="ssx">-</b><span>크기 Y</span><b id="ssy">-</b><span>크기 Z</span><b id="ssz">-</b><span>위치 X</span><b id="spx">-</b><span>위치 Y</span><b id="spy">-</b><span>위치 Z</span><b id="spz">-</b></div><div id="note" class="hint">객체를 클릭하세요.</div></div></div>
</aside><div id="vp"><div id="info"><strong id="it">선택 객체</strong><div id="ib"></div></div><div id="hint">X=가로 · Y=길이 · Z=높이<br>객체 클릭 → 치수/위치 표시</div></div></main><footer id="status">모드: 보기</footer></div>
<script type="module">
import * as THREE from"three";import{OrbitControls}from"three/addons/controls/OrbitControls.js";import{STLLoader}from"three/addons/loaders/STLLoader.js";
const $=id=>document.getElementById(id),vp=$("vp"),scene=new THREE.Scene();scene.background=new THREE.Color(0xe3e8ed);
const cam=new THREE.PerspectiveCamera(42,1,1,30000),ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));vp.prepend(ren.domElement);
const ctl=new OrbitControls(cam,ren.domElement);ctl.enableDamping=true;ctl.screenSpacePanning=true;scene.add(new THREE.HemisphereLight(0xffffff,0x778899,2));const dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(3000,4000,2500);scene.add(dl);
let SX=2500,SY=2500,SZ=2500,grid,bounds,frame,sel,boxH,objs=[],measure=false,mp=[];const ray=new THREE.Raycaster(),pt=new THREE.Vector2(),mg=new THREE.Group();scene.add(mg);
const u2w=(x,y,z)=>new THREE.Vector3(x,z,y),w2u=v=>({x:v.x,y:v.z,z:v.y});
function dispose(o){o.traverse?.(x=>{x.geometry?.dispose();if(x.material){(Array.isArray(x.material)?x.material:[x.material]).forEach(m=>m.dispose())}});o.parent?.remove(o)}
function mkGrid(){grid&&dispose(grid);grid=new THREE.Group();const pts=[];for(let x=0;x<=SX;x+=100)pts.push(new THREE.Vector3(x,0,0),new THREE.Vector3(x,0,SY));for(let y=0;y<=SY;y+=100)pts.push(new THREE.Vector3(0,0,y),new THREE.Vector3(SX,0,y));grid.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xaab7c3})));scene.add(grid)}
function mkBounds(){bounds&&dispose(bounds);bounds=new THREE.Group();const v=[[0,0,0],[SX,0,0],[SX,0,SY],[0,0,SY],[0,SZ,0],[SX,SZ,0],[SX,SZ,SY],[0,SZ,SY]].map(a=>new THREE.Vector3(...a)),e=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]],p=[];e.forEach(a=>p.push(v[a[0]],v[a[1]]));bounds.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(p),new THREE.LineBasicMaterial({color:0x32495d})));scene.add(bounds)}
function view(v="iso"){const c=new THREE.Vector3(SX/2,SZ/2,SY/2),d=Math.max(SX,SY,SZ)*1.7;ctl.target.copy(c);cam.position.set(v==="right"?SX+d:c.x,v==="top"?SZ+d:v==="iso"?SZ+d*.6:c.y,v==="front"?-d:v==="iso"?SY+d*.7:c.z);if(v==="right")cam.position.z=c.z;if(v==="top"){cam.position.x=c.x;cam.position.z=c.z+.01}cam.lookAt(c);ctl.update()}
function rebuild(){SX=+$("sx").value||2500;SY=+$("sy").value||2500;SZ=+$("sz").value||2500;mkGrid();mkBounds();view()}
function part(g,w,d,h,x,y,z,name,kind="frame"){g.position.copy(u2w(x,y,z));g.userData={name,kind,sx:w,sy:d,sz:h,px:x,py:y,pz:z};const ge=new THREE.BoxGeometry(w,h,d),m=new THREE.MeshStandardMaterial({color:kind==="frame"?0x303840:0x8798a6,roughness:.7,metalness:kind==="frame"?.3:.05});const me=new THREE.Mesh(ge,m);me.position.set(w/2,h/2,d/2);me.userData.owner=g;g.add(me);g.add(new THREE.LineSegments(new THREE.EdgesGeometry(ge),new THREE.LineBasicMaterial({color:0x152536})));g.children[1].position.copy(me.position);scene.add(g);objs.push(g);return g}
function buildFrame(){if(frame){objs=objs.filter(o=>o.userData.kind!=="frame");dispose(frame)}frame=new THREE.Group();scene.add(frame);const W=+$("fw").value||900,L=+$("fl").value||2000,H=+$("fh").value||250,rw=+$("rw").value||20,rh=+$("rh").value||40,x=(SX-W)/2,y=(SY-L)/2,z=H-rh,n=+$("cc").value||8;[["좌측 외곽레일",rw,L,rh,x,y],["우측 외곽레일",rw,L,rh,x+W-rw,y],["앞쪽 가로 프레임",W-2*rw,rw,rh,x+rw,y],["뒤쪽 가로 프레임",W-2*rw,rw,rh,x+rw,y+L-rw]].forEach(a=>{const g=new THREE.Group();frame.add(g);part(g,a[1],a[2],a[3],a[4],a[5],z,a[0],"frame")});for(let i=1;i<=n;i++){const yy=y+L*i/(n+1);const g=new THREE.Group();frame.add(g);part(g,W-2*rw,18,18,x+rw,yy,z+rh-18,`가로 지지대 ${i}`,"frame")}const legH=z;[[x,y+40],[x+W-40,y+40],[x,y+L-80],[x+W-40,y+L-80]].forEach((q,i)=>{const g=new THREE.Group();frame.add(g);part(g,40,40,legH,q[0],q[1],0,`다리 ${i+1}`,"frame")})}
function ring(od,bore,t){const s=new THREE.Shape();s.absarc(0,0,od/2,0,Math.PI*2,false);const h=new THREE.Path();h.absarc(0,0,bore/2,0,Math.PI*2,true);s.holes.push(h);const g=new THREE.ExtrudeGeometry(s,{depth:t,bevelEnabled:false,curveSegments:64});g.translate(0,0,-t/2);return g}
function addHub(o={}){const name=o.name||$("hn").value||"BP-Hub-8",od=+(o.od??$("hod").value)||25.5,t=+(o.t??$("ht").value)||10,bore=+(o.bore??$("hb").value)||8,pcd=+(o.pcd??$("hpcd").value)||20,ax=o.ax||$("ha").value,x=+(o.x??$("hx").value)||0,y=+(o.y??$("hy").value)||0,z=+(o.z??$("hz").value)||0,g=new THREE.Group();g.userData={name,kind:"hub",od,t,bore,pcd,ax,px:x,py:y,pz:z};const body=new THREE.Mesh(ring(od,bore,t),new THREE.MeshStandardMaterial({color:0x7b858e,metalness:.75,roughness:.35}));body.userData.owner=g;g.add(body);for(let i=0;i<8;i++){const a=i*Math.PI/4,r=pcd/2,ge=new THREE.CylinderGeometry(1.5,1.5,.3,18);ge.rotateX(Math.PI/2);for(const sd of[-1,1]){const m=new THREE.Mesh(ge,new THREE.MeshBasicMaterial({color:i%2?0x556b7a:0x182a38}));m.position.set(Math.cos(a)*r,Math.sin(a)*r,sd*(t/2+.15));m.userData.owner=g;g.add(m)}}if(ax==="X")g.rotation.y=Math.PI/2;else if(ax==="Z")g.rotation.x=-Math.PI/2;g.position.copy(u2w(x,y,z));g.userData.sx=ax==="X"?t:od;g.userData.sy=ax==="Y"?t:od;g.userData.sz=ax==="Z"?t:od;scene.add(g);objs.push(g);select(g)}
function pick(e){const r=ren.domElement.getBoundingClientRect();pt.x=(e.clientX-r.left)/r.width*2-1;pt.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pt,cam);const h=ray.intersectObjects(objs,true)[0];if(!h)return null;let o=h.object;while(o&&!o.userData?.kind&&!o.userData?.owner)o=o.parent;return o?.userData?.owner||o}
function select(o){sel=o;boxH&&scene.remove(boxH);if(!o){$("info").style.display="none";$("sn").disabled=$("rename").disabled=$("del").disabled=true;return}boxH=new THREE.BoxHelper(o,0x1e6fa8);scene.add(boxH);const d=o.userData,kind=d.kind==="hub"?"원형 허브":d.kind==="frame"?"기본 구조 부품":d.kind==="stl"?"STL":"직육면체";$("sn").disabled=$("rename").disabled=$("del").disabled=false;$("sn").value=d.name;$("sk").textContent=kind;["ssx","ssy","ssz"].forEach((id,i)=>$(id).textContent=[d.sx,d.sy,d.sz][i].toFixed(1)+" mm");["spx","spy","spz"].forEach((id,i)=>$(id).textContent=[d.px,d.py,d.pz][i].toFixed(1)+" mm");$("it").textContent=d.name;$("ib").innerHTML=`${kind}<br>크기 X ${d.sx.toFixed(1)} / Y ${d.sy.toFixed(1)} / Z ${d.sz.toFixed(1)} mm<br>위치 X ${d.px.toFixed(1)} / Y ${d.py.toFixed(1)} / Z ${d.pz.toFixed(1)} mm`;$("info").style.display="block";$("hubCopy").disabled=d.kind!=="hub";$("note").textContent=d.kind==="hub"?`Ø${d.od} × ${d.t}T / 축홀 Ø${d.bore} / PCD${d.pcd} / 축 ${d.ax}`:"X=폭, Y=길이, Z=높이"}
function mpick(e){const r=ren.domElement.getBoundingClientRect();pt.x=(e.clientX-r.left)/r.width*2-1;pt.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(pt,cam);const pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),p=new THREE.Vector3();return ray.ray.intersectPlane(pl,p)?p:null}
ren.domElement.addEventListener("click",e=>{if(measure){const p=mpick(e);if(!p)return;mp.push(p);const m=new THREE.Mesh(new THREE.SphereGeometry(12),new THREE.MeshBasicMaterial({color:0xc23a35}));m.position.copy(p);mg.add(m);if(mp.length===2){mg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(mp),new THREE.LineBasicMaterial({color:0xc23a35})));$("status").textContent=`측정: ${mp[0].distanceTo(mp[1]).toFixed(1)} mm`;mp=[]}return}select(pick(e))});
$("spaceBtn").onclick=rebuild;$("frameBtn").onclick=buildFrame;$("boxBtn").onclick=()=>part(new THREE.Group(),+$("bw").value,+$("bd").value,+$("bh").value,+$("bx").value,+$("by").value,+$("bz").value,$("bn").value||"부품","box");$("hubBtn").onclick=()=>addHub();$("hubCopy").onclick=()=>{if(sel?.userData.kind!=="hub")return;const d=sel.userData;addHub({name:d.name+" 복제",od:d.od,t:d.t,bore:d.bore,pcd:d.pcd,ax:d.ax,x:d.px+(d.ax==="X"?40:0),y:d.py+(d.ax==="Y"?40:0),z:d.pz+(d.ax==="Z"?40:0)})};
$("rename").onclick=()=>{if(sel){sel.userData.name=$("sn").value||sel.userData.name;select(sel)}};$("del").onclick=()=>{if(!sel||sel.userData.kind==="frame")return;objs=objs.filter(x=>x!==sel);const d=sel;select(null);dispose(d)};
$("measure").onclick=()=>{measure=!measure;$("status").textContent=measure?"모드: 2점 측정":"모드: 보기";ctl.enabled=!measure;if(!measure){while(mg.children.length)dispose(mg.children[0]);mp=[]}};
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>view(b.dataset.v));
$("stl").onchange=async e=>{const f=e.target.files[0];if(!f)return;const ge=new STLLoader().parse(await f.arrayBuffer());ge.computeBoundingBox();const s=new THREE.Vector3();ge.boundingBox.getSize(s);ge.translate(-ge.boundingBox.min.x,-ge.boundingBox.min.y,-ge.boundingBox.min.z);const g=new THREE.Group(),m=new THREE.Mesh(ge,new THREE.MeshStandardMaterial({color:0x66798a}));g.add(m);g.position.copy(u2w((SX-s.x)/2,(SY-s.z)/2,0));g.userData={name:f.name,kind:"stl",sx:s.x,sy:s.z,sz:s.y,px:(SX-s.x)/2,py:(SY-s.z)/2,pz:0};scene.add(g);objs.push(g);select(g)};
function resize(){ren.setSize(vp.clientWidth,vp.clientHeight,false);cam.aspect=vp.clientWidth/vp.clientHeight;cam.updateProjectionMatrix()}addEventListener("resize",resize);rebuild();buildFrame();resize();view();(function loop(){requestAnimationFrame(loop);ctl.update();boxH?.update();ren.render(scene,cam)})();
</script></body></html>
